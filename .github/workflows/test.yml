name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq

      # The suite skips sing-box tests when it is absent, but those cover the
      # client config shapes -- including whether the config actually starts,
      # which is the check that caught a config `sing-box check` had approved.
      # Worth having a real binary here.
      - name: Install sing-box
        run: |
          VER=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
                 | jq -r .tag_name | sed 's/^v//')
          curl -fsSL -o /tmp/sb.tgz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tgz -C /tmp
          sudo install -m755 /tmp/sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Run tests
        run: ./test/run-tests.sh

      # A guard against the specific mistake that shipped a live home IP to a
      # public repo: fail the build if anything that looks like a routable
      # address or a key reappears in the tree.
      - name: Check for leaked secrets
        run: |
          set +e
          fail=0
          if grep -rInE '\b(1[0-9]{2}|[1-9][0-9]?)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b' \
               --include='*.md' --include='*.sh' --include='*.yml' . \
             | grep -vE '0\.0\.0\.0|127\.0\.0|255\.255|1\.1\.1\.1|9\.9\.9\.9|10\.66\.6|172\.19\.0|192\.168\.|203\.0\.113|198\.51\.100|100\.64|8\.8\.8\.8'; then
            echo "::error::a routable-looking IP address is present in the tree"
            fail=1
          fi
          if grep -rInE '[A-Za-z0-9+/]{42}=' --include='*.md' --include='*.sh' . ; then
            echo "::error::something shaped like a WireGuard key is present"
            fail=1
          fi
          exit $fail
